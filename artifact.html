<!doctype html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reporte Flor de Guarde SRF</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#F4F2F6;--card:#fff;--ink:#1E1A2B;--mut:#6B647A;--line:#E3DEEA;--acc:#B5174E;--acc2:#0F766E;--soft:#F9E8EF;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14111C;--card:#1D1928;--ink:#EDE9F5;--mut:#9A92AD;--line:#2D2840;--acc:#F0658F;--acc2:#2DD4BF;--soft:#33202B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14111C;--card:#1D1928;--ink:#EDE9F5;--mut:#9A92AD;--line:#2D2840;--acc:#F0658F;--acc2:#2DD4BF;--soft:#33202B;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:clamp(30px,5vw,52px);line-height:1;margin:0;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--mut);margin-top:8px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,th:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:22px;padding:60px 20px;text-align:center;color:var(--mut);background:var(--card);cursor:pointer}
.drop.on{border-color:var(--acc);background:var(--soft)}
.drop b{display:block;font-size:22px;color:var(--ink);margin-bottom:6px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0;border-block:1px solid var(--line);margin-bottom:22px}
.bar label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px}
.bar input,.bar select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
details.f{position:relative}
details.f summary{list-style:none;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;user-select:none}
details.f summary::-webkit-details-marker{display:none}
details.f.has summary{border-color:var(--acc);background:var(--soft)}
details.f .menu{position:absolute;z-index:20;top:calc(100% + 6px);left:0;min-width:210px;max-height:300px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 12px 30px #0003}
.menu label{display:flex;gap:8px;padding:5px 8px;border-radius:8px;color:var(--ink);font-size:14px;cursor:pointer}
.menu label:hover{background:var(--soft)}
.kpis{display:flex;flex-wrap:wrap;margin-bottom:26px}
.kpi{flex:1 1 150px;padding:4px 22px 4px 0;margin-right:22px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi small{color:var(--mut);font-size:13px}
.kpi strong{display:block;font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}
@media(max-width:900px){.c7,.c5{grid-column:span 12}}
.card h2{font-size:16px;margin:0;font-weight:600}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.cv{position:relative;height:300px}
.tw{overflow-x:auto;max-height:520px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--card);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;color:var(--mut);font-weight:600}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--soft)}
.empty{padding:40px;text-align:center;color:var(--mut)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.kpi strong{transition:opacity .2s}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>Reporte Flor de Guarde SRF</h1><div class="sub" id="sub">Carga el reporte para ver el tablero</div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn ghost" id="theme">Tema</button>
  <button class="btn" id="pick">Cargar archivo .xls</button>
 </div>
</header>
<input type="file" id="file" accept=".xls,.xlsx,.csv" hidden>
<div class="drop" id="drop"><b>Arrastra aquí el archivo Reporte_Recepcion_Mallas</b>o haz clic para elegirlo. Se lee la hoja General y la primera fila se usa como filtros. Los datos no salen de tu navegador.</div>

<div id="app" hidden>
 <div class="bar" id="bar"></div>
 <div class="kpis" id="kpis"></div>
 <div class="grid">
  <section class="card c7"><div class="ch"><h2>Evolución por día</h2><label class="sub" style="margin:0">Medida <select id="metric"></select></label></div><div class="cv"><canvas id="c1"></canvas></div></section>
  <section class="card c5"><div class="ch"><h2>Distribución</h2><select id="g2"></select></div><div class="cv"><canvas id="c2"></canvas></div></section>
  <section class="card c12"><div class="ch"><h2>Ranking</h2><select id="g1"></select></div><div class="cv"><canvas id="c3"></canvas></div></section>
  <section class="card c12"><div class="ch"><h2 id="tt">Detalle</h2><div style="display:flex;gap:8px"><button class="btn ghost" id="more">Ver más</button><button class="btn" id="csv">Exportar CSV</button></div></div><div class="tw"><table id="tb"></table></div></section>
 </div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('es-EC',{maximumFractionDigits:1});
const PAL=['#B5174E','#0F766E','#D98E04','#4B3FA6','#2F7D32','#C2410C','#0E7490','#7C3A5E','#64748B','#9D174D','#15803D','#A16207'];
let ALL=[],H=[],D=null,M=[],K=[],F={},S={q:'',from:'',to:'',m:'__n',g1:'',g2:''},SORT={c:null,d:1},LIM=100,CH={};

const LS='guarde_srf_datos_v1';
const iso=v=>{if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');return String(v)};
const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};

function read(file){
 const r=new FileReader();
 r.onload=e=>{try{
  const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
  const sn=wb.Sheets['General']?'General':wb.SheetNames[0];const ws=wb.Sheets[sn];
  let mr=0,mc=0;for(const k in ws){if(k[0]==='!')continue;const a=XLSX.utils.decode_cell(k);if(a.r>mr)mr=a.r;if(a.c>mc)mc=a.c}
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:mr,c:mc}});
  const lb=file.name+' · hoja '+sn+' · '+Math.round(file.size/1024)+' KB';
  ALL=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
  if(!ALL.length)throw new Error('La hoja no tiene filas');
  ALL.forEach(r=>{for(const k in r)if(r[k] instanceof Date)r[k]=iso(r[k])});
  try{localStorage.removeItem(LS);localStorage.setItem(LS,JSON.stringify({name:lb,rows:ALL}))}catch(_){}
  init(lb);
 }catch(x){alert('No se pudo leer el archivo: '+x.message)}};
 r.readAsArrayBuffer(file);
}

function init(name){
 H=Object.keys(ALL[0]);
 const FC=H.find(h=>/^finca$/i.test(h));
 if(FC){const mp={GR:'GRIMP',GI:'TERRAFRUT',LA:'TERRAFRUT',GU:'GUAISA',SE:'GUAISA',ID:'GUAISA',DL:'GUAISA'};
  ALL.forEach(r=>r.Postcosecha=mp[String(r[FC]).trim().toUpperCase()]||'Sin asignar');
  H.splice(H.indexOf(FC)+1,0,'Postcosecha')}
 D=H.find(h=>/fecha/i.test(h))||null;
 M=H.filter(h=>/mallas|tallos|cantidad|ramos/i.test(h)&&ALL.filter(r=>num(r[h])!==null).length>ALL.length*.7);
 ALL.forEach(r=>{M.forEach(m=>r[m]=num(r[m])||0);if(D)r[D]=iso(r[D]).slice(0,10);H.forEach(h=>{if(r[h] instanceof Date)r[h]=iso(r[h])})});
 K=H.filter(h=>h!==D&&!M.includes(h)&&!/hora/i.test(h)&&(u=>u>=2&&u<=60)(new Set(ALL.map(r=>r[h])).size));
 F={};K.forEach(k=>F[k]=new Set());
 S={q:'',from:'',to:'',m:M.includes('Tallos')?'Tallos':(M[0]||'__n'),g1:K.includes('Variedad')?'Variedad':K[0],g2:K.includes('Postcosecha')?'Postcosecha':(K.includes('Finca')?'Finca':(K[1]||K[0]))};
 LIM=100;SORT={c:null,d:1};
 $('#sub').textContent=name+' · '+fmt(ALL.length)+' registros';
 $('#drop').hidden=true;$('#app').hidden=false;
 build();render();
}

function build(){
 let h='<label>Buscar <input id="q" type="search" placeholder="Texto libre"></label>';
 if(D){const ds=ALL.map(r=>r[D]).filter(Boolean).sort();h+=`<label>Desde <input type="date" id="from" min="${ds[0]}" max="${ds.at(-1)}"></label><label>Hasta <input type="date" id="to" min="${ds[0]}" max="${ds.at(-1)}"></label>`}
 K.forEach(k=>{const vals=[...new Set(ALL.map(r=>r[k]))].sort((a,b)=>String(a).localeCompare(String(b),'es',{numeric:true}));
  h+=`<details class="f" data-k="${esc(k)}"><summary>${esc(k)}</summary><div class="menu">${vals.map(v=>`<label><input type="checkbox" value="${esc(v)}"> ${esc(v===''?'(vacío)':v)}</label>`).join('')}</div></details>`});
 h+='<button class="btn ghost" id="clr">Limpiar</button>';
 $('#bar').innerHTML=h;
 $('#q').oninput=e=>{S.q=e.target.value.toLowerCase();LIM=100;render()};
 if(D){$('#from').onchange=e=>{S.from=e.target.value;render()};$('#to').onchange=e=>{S.to=e.target.value;render()}}
 $('#bar').querySelectorAll('details.f').forEach(d=>d.addEventListener('change',e=>{const k=d.dataset.k,v=e.target.value;e.target.checked?F[k].add(v):F[k].delete(v);LIM=100;render()}));
 $('#clr').onclick=()=>{K.forEach(k=>F[k].clear());S.q=S.from=S.to='';$('#q').value='';if(D){$('#from').value='';$('#to').value=''}$('#bar').querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);render()};
 const mo=[['__n','Registros'],...M.map(m=>[m,m])];
 $('#metric').innerHTML=mo.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');$('#metric').value=S.m;
 $('#metric').onchange=e=>{S.m=e.target.value;render()};
 ['g1','g2'].forEach(id=>{const s=$('#'+id);s.innerHTML=K.map(k=>`<option>${esc(k)}</option>`).join('');s.value=S[id];s.onchange=e=>{S[id]=e.target.value;render()}});
}

const rows=()=>ALL.filter(r=>{
 if(S.from&&r[D]<S.from)return false;if(S.to&&r[D]>S.to)return false;
 for(const k of K)if(F[k].size&&!F[k].has(String(r[k])))return false;
 if(S.q&&!H.some(h=>String(r[h]).toLowerCase().includes(S.q)))return false;return true});
const val=r=>S.m==='__n'?1:r[S.m];
const agg=(rs,key)=>{const m=new Map();rs.forEach(r=>m.set(r[key],(m.get(r[key])||0)+val(r)));return m};
const ml=()=>S.m==='__n'?'Registros':S.m;

const inBar={id:'inBar',afterDatasetsDraw(c){
 const x=c.ctx,hz=c.options.indexAxis==='y',mut=getComputedStyle(document.documentElement).getPropertyValue('--mut').trim();
 c.getDatasetMeta(0).data.forEach((b,i)=>{const v=c.data.datasets[0].data[i];if(!v)return;const t=fmt(v);
  x.save();x.font='600 12px "Bricolage Grotesque",system-ui,sans-serif';x.textBaseline='middle';const w=x.measureText(t).width;
  if(hz){if(b.x-b.base>w+14){x.fillStyle='#fff';x.textAlign='right';x.fillText(t,b.x-7,b.y)}else{x.fillStyle=mut;x.textAlign='left';x.fillText(t,b.x+5,b.y)}}
  else{x.textAlign='center';if(b.base-b.y>22){x.fillStyle='#fff';x.fillText(t,b.x,b.y+12)}else{x.fillStyle=mut;x.fillText(t,b.x,b.y-9)}}
  x.restore()})}};
function mk(id,cfg){CH[id]&&CH[id].destroy();CH[id]=new Chart($('#'+id),cfg)}
function render(){
 const rs=rows(),cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--mut').trim(),line=cs.getPropertyValue('--line').trim(),acc=cs.getPropertyValue('--acc').trim();
 Chart.defaults.color=ink;Chart.defaults.font.family='"Bricolage Grotesque",system-ui,sans-serif';
 K.forEach(k=>{const d=$(`details[data-k="${CSS.escape(k)}"]`);if(d){d.classList.toggle('has',F[k].size>0);d.querySelector('summary').textContent=k+(F[k].size?` (${F[k].size})`:'')}});
 // KPIs
 let kp=[['Registros',rs.length]];
 M.slice(0,3).forEach(m=>kp.push([m,rs.reduce((a,r)=>a+r[m],0)]));
 if(M.includes('Tallos')&&M.includes('Mallas')){const t=rs.reduce((a,r)=>a+r.Tallos,0),m=rs.reduce((a,r)=>a+r.Mallas,0);kp.push(['Tallos por malla',m?t/m:0])}
 if(D)kp.push(['Días con recepción',new Set(rs.map(r=>r[D])).size]);
 $('#kpis').innerHTML=kp.map(([l,v])=>`<div class="kpi"><small>${esc(l)}</small><strong>${fmt(v)}</strong></div>`).join('');
 // Tendencia
 if(D){const a=[...agg(rs,D)].sort((x,y)=>String(x[0]).localeCompare(String(y[0])));
  mk('c1',{type:'bar',plugins:[inBar],data:{labels:a.map(x=>x[0]),datasets:[{label:ml(),data:a.map(x=>x[1]),backgroundColor:acc,borderRadius:6}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{grid:{display:false}},y:{grid:{color:line},beginAtZero:true},},onClick:(e,el)=>{if(el.length){const d=a[el[0].index][0];S.from=S.to=d;$('#from').value=$('#to').value=d;render()}}}})}
 // Dona
 const top=(key,n)=>{const a=[...agg(rs,key)].sort((x,y)=>y[1]-x[1]);if(a.length<=n)return a;const r=a.slice(n).reduce((s,x)=>s+x[1],0);return[...a.slice(0,n),['Otros',r]]};
 const tg=(key)=>(e,el)=>{if(!el.length)return;const v=String(window.__lab[key][el[0].index]);if(v==='Otros')return;const cb=$(`details[data-k="${CSS.escape(key)}"] input[value="${CSS.escape(v)}"]`);if(cb){cb.checked=!cb.checked;cb.dispatchEvent(new Event('change',{bubbles:true}))}};
 window.__lab={};
 const d2=top(S.g2,8);window.__lab[S.g2]=d2.map(x=>x[0]);
 mk('c2',{type:'doughnut',data:{labels:d2.map(x=>x[0]),datasets:[{data:d2.map(x=>x[1]),backgroundColor:PAL,borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:10,usePointStyle:true}},tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);return ' '+c.label+': '+fmt(c.parsed)+' ('+(t?(c.parsed/t*100).toFixed(1):0)+'%)'}}}},onClick:tg(S.g2)}});
 const d1=top(S.g1,12);window.__lab[S.g1]=d1.map(x=>x[0]);
 mk('c3',{type:'bar',plugins:[inBar],data:{labels:d1.map(x=>x[0]),datasets:[{label:ml(),data:d1.map(x=>x[1]),backgroundColor:PAL[1],borderRadius:6}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{grid:{color:line},beginAtZero:true},y:{grid:{display:false}}},onClick:tg(S.g1)}});
 table(rs);
}
function table(rs){
 if(SORT.c)rs=[...rs].sort((a,b)=>(a[SORT.c]>b[SORT.c]?1:a[SORT.c]<b[SORT.c]?-1:0)*SORT.d);
 $('#tt').textContent=`Detalle · ${fmt(rs.length)} filas`;
 if(!rs.length){$('#tb').innerHTML='<tr><td class="empty">Ningún registro coincide con los filtros. Pulsa Limpiar para volver a ver todo.</td></tr>';$('#more').hidden=true;return}
 $('#tb').innerHTML='<thead><tr>'+H.map(h=>`<th tabindex="0" data-c="${esc(h)}">${esc(h)}${SORT.c===h?(SORT.d>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+
  rs.slice(0,LIM).map(r=>'<tr>'+H.map(h=>`<td class="${M.includes(h)?'n':''}">${esc(M.includes(h)?fmt(r[h]):r[h])}</td>`).join('')+'</tr>').join('')+'</tbody>';
 $('#more').hidden=rs.length<=LIM;
 $('#tb').querySelectorAll('th').forEach(t=>{const go=()=>{const c=t.dataset.c;SORT=SORT.c===c?{c,d:-SORT.d}:{c,d:1};table(rows())};t.onclick=go;t.onkeydown=e=>{if(e.key==='Enter')go()}});
}
$('#more').onclick=()=>{LIM+=200;table(rows())};
$('#csv').onclick=()=>{const rs=rows();const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const t=[H.map(q).join(','),...rs.map(r=>H.map(h=>q(r[h])).join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='recepcion_mallas_filtrado.csv';a.click()};
// archivo
$('#pick').onclick=()=>$('#file').click();$('#drop').onclick=()=>$('#file').click();
$('#file').onchange=e=>e.target.files[0]&&read(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('on')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('on')}));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];f&&read(f)});
// tema
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme==='dark'||(r.dataset.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark';if(ALL.length)render()};
document.addEventListener('click',e=>{document.querySelectorAll('details.f[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
// restaurar datos guardados
try{const g=JSON.parse(localStorage.getItem(LS)||'null');if(g&&g.rows&&g.rows.length){ALL=g.rows;init(g.name)}}catch(_){}
</script>
</body>
</html>
